plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

allprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    group = 'studio.king220l'
    version = new groovy.json.JsonSlurper().parse(file('resources/fabric.mod.json')).version
    base.archivesName = project == rootProject ? 'King-Music' : "King-Music-${project.name.capitalize()}"
    repositories { mavenCentral() }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    sourceSets.main {
        java.srcDirs = ['src']
        resources.srcDirs = ['resources']
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    jar {
        from(rootProject.file('LICENSE')) { into 'META-INF'; rename { 'LICENSE-KING-MUSIC.txt' } }
        from(rootProject.file('AI_USAGE_NOTICE.md')) { into 'META-INF' }
        if (project != rootProject) {
            from(rootProject.file('resources/assets/yamusic/icon.png')) { into "assets/king_music_${project.name}" }
        }
    }
    jar { archiveFileName = "${base.archivesName.get()}-${project.version}-Fabric-${rootProject.minecraft_version}.jar" }
}

dependencies {
    implementation 'javazoom:jlayer:1.0.1'
    include 'javazoom:jlayer:1.0.1'
}

subprojects {
    dependencies { implementation project(path: ':') }
}

loom {
    runs {
        client {
            runDir 'run'
            programArgs '--username', 'KingMusicTest'
        }
    }
}

// Run Core and Lyrics together without installing anything into a player's profile.
dependencies {
    runtimeOnly files(rootProject.project(':lyrics').sourceSets.main.output)
}
loom.mods {
    yamusic { sourceSet sourceSets.main }
    king_music_lyrics { sourceSet rootProject.project(':lyrics').sourceSets.main }
}

sourceSets {
    regression {
        java.srcDirs = ['wave-tests/tools/stubs', 'wave-tests/src/test/java', 'port-tests/src',
                        'src', 'lyrics/src']
        java.include '**/MusicApi.java', '**/WaveHistory.java', '**/WaveHistoryTest.java',
                     '**/LyricsData.java', '**/PcmSpeed.java', '**/MusicHttp.java', '**/PortRegression.java'
        java.exclude { it.file == file('src/studio/king220l/yamusic/MusicApi.java') }
    }
}
tasks.register('waveRegression', JavaExec) {
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'studio.king220l.yamusic.WaveHistoryTest'
}
tasks.register('portRegression', JavaExec) {
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'studio.king220l.yamusic.PortRegression'
}
check.dependsOn waveRegression, portRegression

if (findProject(':smoke-tests') != null) {
    rootProject.project(':smoke-tests') {
        dependencies {
            implementation project(path: ':lyrics')
        }
    }
    dependencies { runtimeOnly files(rootProject.project(':smoke-tests').sourceSets.main.output) }
    loom.mods { king_music_smoke { sourceSet rootProject.project(':smoke-tests').sourceSets.main } }
    if (project.hasProperty('smokeWorld')) loom.runs.client.vmArg '-Dkingmusic.smoke.world=true'
    if (project.hasProperty('smokeFolder')) {
        loom.runs.client.vmArg '-Dkingmusic.smoke.folder=true'
        loom.runs.client.programArgs '--width', '1600', '--height', '1000'
    }
    if (project.hasProperty('smokeInspect')) loom.runs.client.vmArg '-Dkingmusic.smoke.inspect=true'
}
