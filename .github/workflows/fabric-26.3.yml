name: Fabric 26.3
on:
  push:
    branches: ['port/fabric-26.3']
  pull_request:
    branches: ['port/fabric-26.3']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash gradlew build --console plain
      - run: python tools/verify_port.py
